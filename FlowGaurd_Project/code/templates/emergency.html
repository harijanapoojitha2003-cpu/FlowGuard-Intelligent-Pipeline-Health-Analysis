<!DOCTYPE html>
<html>
<head>
    <title>EMERGENCY ALERT</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body {
            /* 🌌 అచ్చం అదే పర్పుల్ + లీవ్స్ బ్యాక్‌గ్రౌండ్ */
            background-color: #f97316;
            background-image: 
                linear-gradient(rgba(129, 140, 248, 0.7), rgba(79, 70, 229, 0.8)),
                url('https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?q=80&w=1920&auto=format&fit=crop') !important; 
            background-size: cover !important;
            background-position: center !important;
            background-attachment: fixed !important;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 🚨 బ్లింక్ అయ్యే ఎమర్జెన్సీ బాక్స్ */
        .emergency-card {
            background: rgba(15, 23, 42, 0.9) !important;
            border: 4px solid #ef4444 !important;
            border-radius: 20px;
            padding: 40px;
            color: white;
            box-shadow: 0 0 50px rgba(239, 68, 68, 0.6) !important;
            max-width: 600px;
            width: 100%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 30px rgba(239, 68, 68, 0.5); }
            50% { box-shadow: 0 0 60px rgba(239, 68, 68, 0.9); border-color: #f87171 !important; }
            100% { box-shadow: 0 0 30px rgba(239, 68, 68, 0.5); }
        }

        .btn-back {
            background: #ef4444 !important;
            border: none;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 25px;
            padding: 12px 30px;
            color: white !important;
            box-shadow: 0 5px 15px rgba(239, 68, 68, 0.4);
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }
        .btn-back:hover {
            background: #dc2626 !important;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="container text-center">
    <div class="emergency-card mx-auto">
        <h1 class="display-3 text-danger fw-bold mb-3">🚨 CRITICAL ALERT</h1>
        <h3 class="text-warning fw-bold mb-4">Pipeline High Risk Condition Detected!</h3>
        
        <p class="fs-5 text-light mb-4">
            The machine learning engine has detected severe anomalies in pressure or flow rate thresholds. 
            Immediate technical inspection is required.
        </p>

        
        <button onclick="window.history.back()" class="btn btn-back mt-3" style="background-color: #6b21a8 !important; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold;">
    ⬅️ Go Back to Result Page
</button>
    </div>
</div>

</body>
</html>

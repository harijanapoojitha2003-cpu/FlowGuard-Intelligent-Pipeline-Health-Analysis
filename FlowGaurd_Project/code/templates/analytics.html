<!DOCTYPE html>
<html>
<head>
    <title>Dataset Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body {
    /* 🌌 అన్ని పేజీలకు ఒకే రకమైన పర్పుల్ లీవ్స్/ఫెదర్ పాటర్న్ థీమ్ */
    background-color: #818cf8 !important;
    background-image: 
        linear-gradient(rgba(129, 140, 248, 0.75), rgba(79, 70, 229, 0.85)),
        url('https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?q=80&w=1920&auto=format&fit=crop') !important; 
    background-size: cover !important;
    background-position: center !important;
    background-attachment: fixed !important;
    min-height: 100vh;
    
    /* 👁️ ఈ పేజీల్లో కూడా టెక్స్ట్ మరియు హెడ్డింగ్స్ క్లియర్ గా కనిపించడానికి సేఫ్టీ కలర్ */
    color: #1e293b !important;
}
        .navbar {
            background-color: #0f172a !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .card {
            background: rgba(30, 41, 59, 0.7) !important;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            border-radius: 20px;
            color: #ffffff;
        }
        h2, h4 {
            font-weight: bold;
        }
        canvas {
            background: rgba(239, 255, 18, 1);
            border-radius: 12px;
            padding: 10px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand">FlowGuard - Analytics Desk</span>
    </nav>

    <div class="container mt-5">
        <div class="text-center mb-4">
            <h2>Pipeline Dataset Insights</h2>
            <p class="text-muted">Statistical distributions of trained pipeline sensor metrics</p>
        </div>

        <div class="row g-4">
            <div class="col-md-6">
                <div class="card p-4 shadow">
                    <h4>Risk Level Class Distribution</h4>
                    <canvas id="riskChart" height="200"></canvas>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card p-4 shadow">
                    <h4>Average Sensor Operational Ranges</h4>
                    <canvas id="metricsChart" height="200"></canvas>
                </div>
            </div>
        </div>

        <div class="text-center mt-5 mb-5">
            <a href="#" onclick="history.back(); return false;" class="btn btn-primary">← Go Back</a>
        </div>
    </div>

    <script>
        // Risk Chart Data Simulation exactly matching your project logic
        new Chart(document.getElementById("riskChart"), {
            type: 'bar',
            data: {
                labels: ['Low Risk', 'Medium Risk', 'High Risk'],
                datasets: [{
                    label: 'Total Rows Data Count',
                    data: [12400, 5200, 2400],
                    backgroundColor: ['#198754', '#ffc107', '#dc3545'],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } }
            }
        });

        // Average Metrics Chart Data Simulation
        new Chart(document.getElementById("metricsChart"), {
            type: 'line',
            data: {
                labels: ['Normal State', 'Leak Detected', 'Pipe Burst'],
                datasets: [{
                    label: 'Avg Pressure (bar)',
                    data: [4.2, 6.5, 9.2],
                    borderColor: '#3b82f6',
                    tension: 0.1,
                    fill: false
                }, {
                    label: 'Avg Temperature (°C)',
                    data: [32.0, 41.5, 52.8],
                    borderColor: '#ec4899',
                    tension: 0.1,
                    fill: false
                }]
            },
            options: {
                responsive: true
            }
        });
    </script>
</body>
</html>
